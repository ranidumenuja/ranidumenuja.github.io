    <!-- ========================================================= -->
    <!-- LIGHTBOX -->
    <!-- ========================================================= -->

    <div
        id="lightbox"
        class="fixed inset-0 bg-black/80 backdrop-blur-2xl z-[100] hidden flex items-center justify-center p-4 md:p-12 cursor-pointer transition-all duration-500 opacity-0"
        onclick="closeLightbox()"
    >

        <div class="relative max-w-5xl w-full h-full flex items-center justify-center">

            <button
                type="button"
                onclick="event.stopPropagation(); closeLightbox();"
                class="absolute top-4 right-4 text-white/50 hover:text-white p-3 bg-white/10 rounded-full backdrop-blur-md z-10"
                aria-label="Close image"
            >
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>

            <img
                id="lightbox-img"
                src=""
                class="max-w-full max-h-full rounded-2xl shadow-2xl object-contain transform scale-95 transition-transform duration-500"
                alt="Enlarged Photo"
            >

        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
